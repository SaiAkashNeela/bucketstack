name: Release Build (Windows, Linux & macOS)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.1.0)'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  build-windows:
    needs: [build-frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies (for tauri CLI and build tools)
        run: bun install

      - name: Resolve release tag
        id: get_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION=$(jq -r '.version' package.json)
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        shell: bash

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.get_tag.outputs.tag }}
          releaseName: 'BucketStack ${{ steps.get_tag.outputs.tag }}'
          releaseBody: 'See assets for all platform builds'
          releaseDraft: true
          prerelease: false
          projectPath: ./
          args: ''

  build-linux:
    needs: [build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install dependencies (for tauri CLI and build tools)
        run: bun install

      - name: Resolve release tag
        id: get_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION=$(jq -r '.version' package.json)
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.get_tag.outputs.tag }}
          releaseName: 'BucketStack ${{ steps.get_tag.outputs.tag }}'
          releaseBody: 'See assets for all platform builds'
          releaseDraft: true
          prerelease: false
          projectPath: ./
          args: ''

  build-macos:
    needs: [build-frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Import signing certificate
        run: |
          echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p temp-ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p temp-ci build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -s build.keychain ~/Library/Keychains/login.keychain-db
          security default-keychain -s build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp-ci build.keychain
          rm /tmp/certificate.p12

      - name: Write notarization API key
        run: |
          mkdir -p ~/.private_keys
          echo "${{ secrets.APPLE_API_KEY_CONTENT }}" | base64 --decode > ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8

      - name: Install dependencies
        run: bun install

      - name: Resolve release tag
        id: get_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION=$(jq -r '.version' package.json)
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        with:
          tagName: ${{ steps.get_tag.outputs.tag }}
          releaseName: 'BucketStack ${{ steps.get_tag.outputs.tag }}'
          releaseBody: 'See assets for all platform builds'
          releaseDraft: true
          prerelease: false
          projectPath: ./
          args: --target universal-apple-darwin

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
          security list-keychains -s ~/Library/Keychains/login.keychain-db
          rm -f ~/.private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8

  generate-manifest:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate and upload manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            VERSION="${TAG#v}"
          else
            VERSION=$(jq -r '.version' package.json)
            TAG="v$VERSION"
          fi
          REPO=${{ github.repository }}

          # Get release info. The release is still a draft here, so publishedAt
          # is null: fall back to "now" (pub_date must be RFC 3339 or the
          # updater rejects the whole manifest).
          RELEASE=$(gh release view "$TAG" --json publishedAt,assets)
          PUB_DATE=$(echo "$RELEASE" | jq -r '.publishedAt // empty')
          if [ -z "$PUB_DATE" ] || [ "$PUB_DATE" = "null" ]; then
            PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi

          ASSETS=$(echo "$RELEASE" | jq -r '.assets[].name' | grep -v '\.sig$' || true)
          pick() { echo "$ASSETS" | grep -E "$1" | head -1 || true; }

          MACOS_TAR=$(pick 'universal.*\.app\.tar\.gz$')
          WINDOWS_NSIS=$(pick '_x64-setup\.exe$')
          WINDOWS_MSI=$(pick '_x64.*\.msi$')
          LINUX_APPIMAGE=$(pick '_amd64\.AppImage$')
          LINUX_DEB=$(pick '_amd64\.deb$')
          LINUX_RPM=$(pick '\.x86_64\.rpm$')

          # STRICT GUARD: Ensure all 3 platform builds succeeded and uploaded assets
          if [ -z "$MACOS_TAR" ] || [ -z "$WINDOWS_NSIS$WINDOWS_MSI" ] || [ -z "$LINUX_APPIMAGE$LINUX_DEB$LINUX_RPM" ]; then
            echo "::error::RELEASE CANCELLED! Not all platform builds succeeded."
            echo "macOS updater bundle: ${MACOS_TAR:-MISSING}"
            echo "Windows installer: ${WINDOWS_NSIS:-${WINDOWS_MSI:-MISSING}}"
            echo "Linux package: ${LINUX_APPIMAGE:-${LINUX_DEB:-${LINUX_RPM:-MISSING}}}"
            echo "All 3 platform builds (macOS, Windows, Linux) must succeed before a release is published."
            exit 1
          fi

          # The updater needs the *contents* of each .sig file (a URL does not work)
          mkdir -p sigs
          gh release download "$TAG" --pattern '*.sig' --dir sigs --clobber

          MANIFEST=$(jq -n --arg v "$VERSION" --arg d "$PUB_DATE" \
            '{version: $v, notes: ("Release " + $v), pub_date: $d, platforms: {}}')

          # add_platform <platform key> <asset name>
          add_platform() {
            [ -n "$2" ] || return 0
            if [ ! -s "sigs/$2.sig" ]; then
              echo "::error::Missing signature for $2"
              exit 1
            fi
            MANIFEST=$(echo "$MANIFEST" | jq --arg k "$1" \
              --arg url "https://github.com/$REPO/releases/download/$TAG/$2" \
              --rawfile sig "sigs/$2.sig" \
              '.platforms[$k] = {url: $url, signature: ($sig | rtrimstr("\n"))}')
          }

          # The updater looks up "{os}-{arch}-{installer}" first, then "{os}-{arch}",
          # so each install type gets a matching package plus a generic fallback.
          for k in darwin-aarch64 darwin-x86_64 darwin-aarch64-app darwin-x86_64-app; do
            add_platform "$k" "$MACOS_TAR"
          done
          add_platform windows-x86_64-nsis "$WINDOWS_NSIS"
          add_platform windows-x86_64-msi "$WINDOWS_MSI"
          add_platform windows-x86_64 "${WINDOWS_NSIS:-$WINDOWS_MSI}"
          add_platform linux-x86_64-appimage "$LINUX_APPIMAGE"
          add_platform linux-x86_64-deb "$LINUX_DEB"
          add_platform linux-x86_64-rpm "$LINUX_RPM"
          add_platform linux-x86_64 "${LINUX_APPIMAGE:-${LINUX_DEB:-$LINUX_RPM}}"

          # Validate: the updater rejects the whole file if any entry is invalid
          echo "$MANIFEST" | jq -e '
            (.version | length > 0)
            and (.pub_date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+(Z|[+-][0-9]{2}:[0-9]{2})$"))
            and ([.platforms[] | (.url | startswith("https://")) and (.signature | length > 0) and ((.signature | startswith("http")) | not)] | all)
          ' > /dev/null || { echo "::error::Generated latest.json is invalid"; echo "$MANIFEST"; exit 1; }

          echo "$MANIFEST" | jq . > latest.json
          echo "Generated manifest:"
          cat latest.json

          # Publish release (make it visible)
          gh release edit "$TAG" --draft=false

          # Upload manifest
          gh release upload "$TAG" latest.json --clobber

  bump-version:
    runs-on: ubuntu-latest
    needs: [generate-manifest]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Bump patch version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            VERSION="${TAG#v}"
          else
            VERSION=$(jq -r '.version' package.json)
            TAG="v$VERSION"
          fi

          # Increment patch version (e.g. 1.0.5 → 1.0.6)
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Bumping $VERSION → $NEW_VERSION"

          # package.json
          jq --arg v "$NEW_VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

          # tauri.conf.json
          jq --arg v "$NEW_VERSION" '.version = $v' tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json

          # Cargo.toml (first occurrence only — the [package] version)
          sed -i "0,/^version = \"$VERSION\"/s/version = \"$VERSION\"/version = \"$NEW_VERSION\"/" Cargo.toml

          # Cargo.lock (the BucketStack package entry)
          sed -i "/^name = \"BucketStack\"/{n;s/version = \"$VERSION\"/version = \"$NEW_VERSION\"/}" Cargo.lock

          # Update site fallback URLs to the just-released version
          REPO="SaiAkashNeela/bucketstack"
          sed -i "s|releases/download/v[0-9.]\+/BucketStack_[0-9.]\+_aarch64\.dmg|releases/download/v$VERSION/BucketStack_${VERSION}_aarch64.dmg|g" bucketstack-site/services/releaseService.ts
          sed -i "s|releases/download/v[0-9.]\+/BucketStack_[0-9.]\+_x64-setup\.exe|releases/download/v$VERSION/BucketStack_${VERSION}_x64-setup.exe|g" bucketstack-site/services/releaseService.ts
          sed -i "s|releases/tag/v[0-9.]\+|releases/tag/v$VERSION|g" bucketstack-site/services/releaseService.ts

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and push release tag and version branch (e.g. v1.0.5)
          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true
          git push origin HEAD:refs/heads/"$TAG" 2>/dev/null || true

          git add package.json tauri.conf.json Cargo.toml Cargo.lock bucketstack-site/services/releaseService.ts
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin main
